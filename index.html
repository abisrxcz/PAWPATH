      if (currentView === 'home' && !currentUser) {
        root.innerHTML = renderLandingPage();
      } else if (currentView === 'home' || currentView === 'role-hub') {
        root.innerHTML = renderRoleHub();
      } else if (currentView === 'map') {
        root.innerHTML = renderAdoptionMap();
      } else if (currentView === 'chat') {
        root.innerHTML = renderChatView();
      } else if (currentView === 'health') {
        root.innerHTML = renderHealthCenters();
      } else if (currentView === 'food') {
        root.innerHTML = renderFoodShops();
      } else if (currentView === 'rehome') {
        root.innerHTML = renderRehomeForm();
      } else if (currentView === 'stray') {
        root.innerHTML = renderStrayReportForm();
      }
    }

          <div class="relative w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-black">✕</button>
            <h2 class="font-display text-2xl font-bold text-[#1A1A1A]">Log In</h2>
            <p class="text-xs text-[#5A635C] mt-1">Access PawPath Manila Adoption Dashboard.</p>

            <form onsubmit="handleLogin(event)" class="mt-5 space-y-4">
              <input id="login-email" type="email" required placeholder="Email Address" class="w-full h-11 px-3.5 rounded-xl border border-[#E2E4DE] text-sm">
              <input id="login-pwd" type="password" required placeholder="Password" class="w-full h-11 px-3.5 rounded-xl border border-[#E2E4DE] text-sm">
              <button type="submit" class="w-full h-11 rounded-full bg-[#2D5A3C] text-white text-sm font-semibold">Log In</button>
            </form>

            <div class="mt-4 pt-4 border-t border-gray-100">
              <button type="button" onclick="demoLogin()" class="w-full h-11 rounded-full border border-[#2D5A3C] text-[#2D5A3C] font-semibold text-xs hover:bg-[#2D5A3C]/5">
                ⚡ 1-Click Demo Login (Cinna Moroll)
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function openSignupModal() {
      const container = document.getElementById('modal-container');
      container.classList.remove('hidden');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="relative w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-black">✕</button>
            <h2 class="font-display text-2xl font-bold text-[#1A1A1A]">Create PawPath Account</h2>
            <p class="text-xs text-[#5A635C] mt-1">Join Manila's centralized network for pet adoption.</p>

            <form onsubmit="handleSignup(event)" class="mt-5 space-y-3">
              <input id="su-name" type="text" required placeholder="Full Name" class="w-full h-10 px-3.5 rounded-xl border border-[#E2E4DE] text-sm">
              <input id="su-email" type="email" required placeholder="Email Address" class="w-full h-10 px-3.5 rounded-xl border border-[#E2E4DE] text-sm">
              <div class="grid grid-cols-2 gap-2">
                <input id="su-age" type="number" min="18" required placeholder="Age (18+)" class="w-full h-10 px-3.5 rounded-xl border border-[#E2E4DE] text-sm">
                <input id="su-mobile" type="tel" required placeholder="+63 917 xxx" class="w-full h-10 px-3.5 rounded-xl border border-[#E2E4DE] text-sm">
              </div>
              <input id="su-district" type="text" required placeholder="Manila District (e.g. Sampaloc)" class="w-full h-10 px-3.5 rounded-xl border border-[#E2E4DE] text-sm">
              <label class="flex items-start gap-2 text-xs text-[#414942]">
                <input type="checkbox" required class="mt-0.5 accent-[#2D5A3C]">
                <span>I confirm I am at least 18 years old and reside in Metro Manila.</span>
              </label>
              <button type="submit" class="w-full h-11 rounded-full bg-[#2D5A3C] text-white text-sm font-semibold">Create Account</button>
            </form>
          </div>
        </div>
      `;
    }

    function closeModal() {
      const container = document.getElementById('modal-container');
      container.classList.add('hidden');
      container.innerHTML = '';
    }

    function demoLogin() {
      currentUser = DEMO_USER;
      saveStorage();
      closeModal();
      navigateTo('role-hub');
      showToast('Welcome back, Cinna Moroll!');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      currentUser = {
        id: 'usr-' + Date.now(),
        fullName: email.split('@')[0].replace(/[._]/g, ' '),
        email: email,
        mobile: '+63 917 555 0188',
        district: 'Sampaloc',
        barangay: 'Barangay 402',
        role: 'citizen'
      };
      saveStorage();
      closeModal();
      navigateTo('role-hub');
      showToast('Logged in successfully!');
    }

    function handleSignup(e) {
      e.preventDefault();
      currentUser = {
        id: 'usr-' + Date.now(),
        fullName: document.getElementById('su-name').value,
        email: document.getElementById('su-email').value,
        mobile: document.getElementById('su-mobile').value,
        age: parseInt(document.getElementById('su-age').value),
        district: document.getElementById('su-district').value,
        barangay: 'Metro Manila',
        role: 'citizen'
      };
      saveStorage();
      closeModal();
      navigateTo('role-hub');
      showToast('Account created!');
    }

    function selectPetPin(id) {
      activePetId = id;
      renderApp();
    }

    function startAdopt(id) {
      activePetId = id;
      if (!currentUser) {
        openLoginModal();
        showToast('Please log in or click Demo Login to message the shelter.');
        return;
      }
      navigateTo('chat');
    }

    function handleSendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const newMsg = {
        id: 'm-' + Date.now(),
        petId: activePetId,
        senderName: currentUser ? currentUser.fullName : 'You',
        senderRole: 'adopter',
        body: text,
        createdAt: 'Just now'
      };

      messagesData.push(newMsg);
      saveStorage();
      renderApp();

      // Simulated shelter reply
      setTimeout(() => {
        const activePet = petsData.find(p => p.id === activePetId);
        messagesData.push({
          id: 'm-reply-' + Date.now(),
          petId: activePetId,
          senderName: activePet ? activePet.reporterName : 'Coordinator',
          senderRole: 'coordinator',
          body: `Thank you! We received your message. Please prepare 1 valid government ID for verification.`,
          createdAt: 'Just now'
        });
        saveStorage();
        renderApp();
      }, 800);
    }

    function handleStageTransition(stage) {
      const activePet = petsData.find(p => p.id === activePetId);
      if (!activePet) return;

      if (stage === 'Ongoing Adoption') {
        openRA10631Modal(activePet);
        return;
      }

      activePet.adoptionStage = stage;
      if (stage === 'Pet Adopted') {
        activePet.status = 'PET ADOPTED';
        showToast(`${activePet.name} marked as Pet Adopted and removed from public active search.`);
      } else {
        showToast(`Adoption lifecycle updated to ${stage}.`);
      }
      saveStorage();
      renderApp();
    }

    function openRA10631Modal(pet) {
      const container = document.getElementById('modal-container');
      container.classList.remove('hidden');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="relative w-full max-w-lg bg-white rounded-3xl p-6 sm:p-7 shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-black">✕</button>
            <span class="text-xs font-bold text-[#2D5A3C] uppercase tracking-wider">RA 10631 Compliance</span>
            <h3 class="font-display text-xl font-bold text-[#1A1A1A] mt-1">Animal Welfare Act Digital Agreement</h3>
            <p class="text-xs text-[#5A635C] mt-1">Required before adopting <strong>${pet.name}</strong>.</p>

            <form onsubmit="handleSignAgreement(event, '${pet.id}')" class="mt-4 space-y-3.5 text-xs text-[#414942]">
              <div>
                <label class="block font-semibold mb-1">Government ID Type</label>
                <select class="w-full h-10 px-3 rounded-xl border border-[#E2E4DE] bg-white">
                  <option>Philippine National ID (PhilSys)</option>
                  <option>Driver's License</option>
                  <option>Passport</option>
                </select>
              </div>
              <div>
                <label class="block font-semibold mb-1">ID Number *</label>
                <input required type="text" placeholder="e.g. 1234-5678-9012" class="w-full h-10 px-3.5 rounded-xl border border-[#E2E4DE]">
              </div>
              <div class="p-3 bg-[#F7F8F4] rounded-xl space-y-2">
                <label class="flex items-start gap-2">
                  <input type="checkbox" required class="accent-[#2D5A3C] mt-0.5">
                  <span>I agree to provide humane food, water, and veterinary care under RA 10631 anti-cruelty rules.</span>
                </label>
                <label class="flex items-start gap-2">
                  <input type="checkbox" required class="accent-[#2D5A3C] mt-0.5">
                  <span><strong>Non-Relinquishment Rule:</strong> I will never abandon or sell this animal. I will return the pet to the shelter if needed.</span>
                </label>
              </div>
              <button type="submit" class="w-full h-11 rounded-full bg-[#2D5A3C] text-white font-semibold text-sm">Sign Agreement &amp; Continue</button>
            </form>
          </div>
        </div>
      `;
    }

    function handleSignAgreement(e, petId) {
      e.preventDefault();
      const pet = petsData.find(p => p.id === petId);
      if (pet) {
        pet.adoptionStage = 'Ongoing Adoption';
        saveStorage();
      }
      closeModal();
      showToast('RA 10631 Digital Agreement signed!');
      renderApp();
    }

    function handleRehomeSubmit(e) {
      e.preventDefault();
      const newPet = {
        id: 'pet-' + Date.now(),
        name: document.getElementById('reh-name').value,
        species: document.getElementById('reh-species').value,
        breed: document.getElementById('reh-breed').value,
        ageLabel: document.getElementById('reh-age').value,
        status: 'HEALTHY',
        adoptionStage: 'Available',
        listingType: 'rehome',
        district: 'Manila',
        barangay: document.getElementById('reh-loc').value,
        vaccinated: true,
        medicalNotes: document.getElementById('reh-reason').value,
        reporterName: currentUser ? currentUser.fullName : 'Manila Resident',
        imageUrl: '/assets/images/pet_bantay_aspin_1794457122492.jpg'
      };
      petsData.unshift(newPet);
      saveStorage();
      activePetId = newPet.id;
      navigateTo('map');
      showToast(`${newPet.name} is now listed on PawPath Manila!`);
    }

    function handleStraySubmit(e) {
      e.preventDefault();
      const species = document.getElementById('stray-species').value;
      const newStray = {
        id: 'stray-' + Date.now(),
        name: `Stray ${species}`,
        species: species,
        breed: `Stray ${species} / Urgent Dispatch`,
        ageLabel: 'Unknown Age',
        status: 'URGENT RESCUE',
        adoptionStage: 'Available',
        listingType: 'stray',
        district: 'Manila',
        barangay: document.getElementById('stray-loc').value,
        vaccinated: false,
        medicalNotes: document.getElementById('stray-desc').value,
        reporterName: currentUser ? currentUser.fullName : 'Citizen',
        imageUrl: '/assets/images/pet_soju_rescue_1794457122662.jpg'
      };
      petsData.unshift(newStray);
      saveStorage();
      activePetId = newStray.id;
      navigateTo('map');
      showToast('Stray emergency alert dispatched to the map!');
    }

    function handleContact(e) {
      e.preventDefault();
      showToast('Inquiry received! The team will reach out.');
      document.getElementById('contact-name').value = '';
      document.getElementById('contact-email').value = '';
      document.getElementById('contact-msg').value = '';
    }

    function bookAppointment(clinicName) {
      showToast(`Appointment requested at ${clinicName}!`);
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      renderApp();
      showToast(`Added ${name} to your supply cart.`);
    }

    // Initialize App
    updateNav();
    renderApp();
  </script>
</body>
</html>
