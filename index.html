        const LS_KEYS = {

        function lsRead(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return fallback;
            const parsed = JSON.parse(raw);
            return parsed ?? fallback;
          } catch (_) {
            return fallback;
          }
        }

        function lsWrite(key, val) {
          try {
            if (val === null || val === undefined) localStorage.removeItem(key);
            else localStorage.setItem(key, JSON.stringify(val));
          } catch (_) {}
        }

        // Pets live in Supabase when configured; localStorage is only the offline demo store.
        function persistPets() {
          if (!sb) lsWrite(LS_KEYS.PETS, S.pets);

        // ---------------------------------------------------------------------
        // Accounts (demo mode keeps a real per-device account registry)
        // ---------------------------------------------------------------------
        async function hashPw(email, pw) {
          const text = `pawpath:${String(email).toLowerCase()}:${pw}`;
          try {
            if (window.crypto && window.crypto.subtle) {
              const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
              return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
            }
          } catch (_) {}
          let h = 5381;
          for (let i = 0; i < text.length; i += 1) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
          return 'x' + (h >>> 0).toString(16);
        }
        const getAccounts = () => {
          const a = lsRead(LS_KEYS.ACCOUNTS, []);
          return Array.isArray(a) ? a : [];

        // Build the app's user object from a Supabase auth user (+ profiles row, created if missing).
        async function loadProfile(user) {
          const meta = user.user_metadata || {};
          let row = null;
          try {
            const r = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
            row = r.data || null;
          } catch (_) {}
          if (!row) {
            const fresh = {
              id: user.id,
              full_name: meta.full_name || (user.email || 'Manila Citizen').split('@')[0].replace(/[._]/g, ' '),
              email: user.email,
              mobile: meta.mobile || null,
              age: meta.age ? Number(meta.age) : null,
              is_adult_confirmed: Boolean(meta.age),
              district: meta.district || 'Sampaloc',
              barangay: meta.barangay || meta.district || 'Metro Manila',
              role: 'citizen',
            };
            try { await sb.from('profiles').upsert(fresh); } catch (_) {}
            row = fresh;

          return {
            id: user.id,
            fullName: row.full_name,
            email: row.email || user.email,
            mobile: row.mobile || meta.mobile || '',
            age: row.age || meta.age || null,

          const t = new Date(iso).getTime();

          const sec = Math.max(0, Math.round((Date.now() - t) / 1000));
          if (sec < 60) return 'Just now';
          if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
          if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;

          return list.map((a) => {
            const stage = a.stage === 'Ongoing Adoption' && /^Pending/i.test(a.coordinatorReviewStatus || '') ? 'Pending Coordinator Review' : a.stage;
            return { ...a, stage, coordinatorReviewStatus: REVIEW_STATUS[stage] || a.coordinatorReviewStatus, createdAt: a.createdAt || nowIso() };
          });
        }

        function rowToRequest(r) {
          const d = r.details || {};
          return {
            id: String(r.id),
            petId: String(r.pet_id),
            petName: r.pet_name || 'Pet',
            applicantId: r.applicant_id ? String(r.applicant_id) : null,
            applicantName: r.applicant_name,
            applicantMobile: r.applicant_mobile || '',
            applicantDistrict: r.applicant_district || '',
            ownerId: r.owner_id ? String(r.owner_id) : null,
            ownerName: r.owner_name || '',
            stage: r.stage,
            coordinatorReviewStatus: r.review_status || REVIEW_STATUS[r.stage] || '',
            backgroundCheck: d.backgroundCheck || {},
            ra10631: d.ra10631 || {},
            submittedAt: shortDate(r.created_at),
            createdAt: r.created_at,
            updatedAt: r.updated_at,
          };
        }
        function rowToNotif(r) {
          return {
            id: String(r.id),
            recipientId: String(r.recipient_id),
            type: r.type,
            title: r.title,
            body: r.body || '',
            petId: r.pet_id ? String(r.pet_id) : null,
            requestId: r.request_id ? String(r.request_id) : null,
            read: Boolean(r.read),
            createdAt: r.created_at,
          };
        }
        function upsertRequestLocal(req) {
          const i = S.applications.findIndex((a) => a.id === req.id);
          S.applications = i >= 0 ? S.applications.map((a) => (a.id === req.id ? { ...a, ...req } : a)) : [req, ...S.applications];
        }

        const isMyListing = (p) => {
          const u = S.user;
          if (!u || !p) return false;
          if (p.ownerId) return p.ownerId === u.id;
          return p.reporterName === u.fullName;
        };
        // Owner id for a pet; in demo mode older listings fall back to the account whose name matches the reporter.
        function ownerIdFor(p) {
          if (p.ownerId) return p.ownerId;
          const acct = getAccounts().find((a) => a.profile && a.profile.fullName === p.reporterName);
          return acct ? acct.profile.id : null;
        }
        const myNotifs = () => (S.user ? S.notifications.filter((n) => n.recipientId === S.user.id) : []);
        const myApplications = () => (S.user ? S.applications.filter((a) => a.applicantId === S.user.id) : []);
        const requestsForPet = (petId) => S.applications.filter((a) => a.petId === petId);
        const pendingForMyPets = () => S.applications.filter((a) => S.user && a.ownerId === S.user.id && a.stage === 'Pending Coordinator Review').length;

        async function pushNotif(n) {
          if (!n.recipientId) return;
          if (sb) {
            try {
              await sb.from('notifications').insert({
                recipient_id: n.recipientId,
                type: n.type,
                title: n.title,
                body: n.body || null,
                pet_id: n.petId && UUID_RE.test(String(n.petId)) ? n.petId : null,
                request_id: n.requestId && UUID_RE.test(String(n.requestId)) ? n.requestId : null,
              });
            } catch (_) {}
            return;
          }
          S.notifications = [
            { id: `n-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, read: false, createdAt: nowIso(), ...n },
            ...S.notifications,
          ];
          persistNotifs();
        }

        async function syncUserData() {
          if (!sb || !S.user) return;
          try {
            const [rq, nt] = await Promise.all([
              sb.from('adoption_requests').select('*').order('created_at', { ascending: false }),
              sb.from('notifications').select('*').eq('recipient_id', S.user.id).order('created_at', { ascending: false }).limit(60),
            ]);
            if (!rq.error && Array.isArray(rq.data)) S.applications = rq.data.map(rowToRequest);
            if (!nt.error && Array.isArray(nt.data)) S.notifications = nt.data.map(rowToNotif);
            render();
          } catch (_) {}
        }

        let userChannel = null;
        function stopUserRealtime() {
          if (userChannel && sb) {
            try { sb.removeChannel(userChannel); } catch (_) {}
          }
          userChannel = null;
        }
        function subscribeUserRealtime() {
          if (!sb || !S.user || userChannel) return;
          const uid = S.user.id;
          userChannel = sb
            .channel(`pawpath-user-${uid}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'adoption_requests' }, (payload) => {
              if (payload.eventType === 'DELETE') {
                if (payload.old && payload.old.id) S.applications = S.applications.filter((a) => a.id !== String(payload.old.id));
              } else if (payload.new) {
                upsertRequestLocal(rowToRequest(payload.new));
              }
              render();
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `recipient_id=eq.${uid}` }, (payload) => {
              const n = rowToNotif(payload.new);
              if (!S.notifications.some((x) => x.id === n.id)) S.notifications = [n, ...S.notifications];
              toast(n.title);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'notifications', filter: `recipient_id=eq.${uid}` }, (payload) => {
              const n = rowToNotif(payload.new);
              S.notifications = S.notifications.map((x) => (x.id === n.id ? n : x));
              render();
            })
            .subscribe((status) => {
              if (status === 'SUBSCRIBED') syncUserData();
            });
        }

        async function restoreSession() {
          if (!sb) return;
          try {
            const { data } = await sb.auth.getSession();
            const user = data && data.session && data.session.user;
            if (user) {
              if (!S.user || S.user.id !== user.id) {
                S.user = await loadProfile(user);
                lsWrite(LS_KEYS.USER, S.user);
              }
              syncUserData();
              subscribeUserRealtime();
              render();
            } else if (S.user) {
              // Saved browser profile without a live Supabase session: ask the person to log in again.
              S.user = null;
              lsWrite(LS_KEYS.USER, null);
              render();
            }
          } catch (_) {}
        }

        // Normalize pet image fallback for persisted older entries
        function safePetImage(pet) {
          if (pet && typeof pet.imageUrl === 'string' && /^(data:image\/|https?:\/\/)/.test(pet.imageUrl)) {
            return pet.imageUrl;
          }
          if (pet && PET_IMAGE_ASSETS[pet.id]) return PET_IMAGE_ASSETS[pet.id];
          return PET_IMAGE_ASSETS[pet && pet.species] || IMG_BANTAY;
        }

        // =========================================================================
        // 4. APPLICATION STATE
        // =========================================================================
        // Zero pre-logged pets. With Supabase configured the feed starts empty and fills from the
        // database; in local demo mode only pets users log themselves are kept in localStorage.
        const SEED_PET_IDS = /^pet-(bantay|muning|soju|luna|cooper|peanut)$/;
        const storedPets = sb ? null : lsRead(LS_KEYS.PETS, null);
        const initialPets = Array.isArray(storedPets)
          ? storedPets.filter((p) => !SEED_PET_IDS.test(String(p.id))).map((p) => ({ ...p, imageUrl: safePetImage(p) }))

        const storedMsgs = lsRead(LS_KEYS.MESSAGES, null);
        const initialMsgs = Array.isArray(storedMsgs) ? storedMsgs.filter((m) => !SEED_PET_IDS.test(String(m.petId))) : [];

        const S = {
          user: lsRead(LS_KEYS.USER, null),
          view: 'home',
          mapPane: 'adoption',
          pets: initialPets,
          selectedPetId: initialPets[0] ? initialPets[0].id : null,
          petFilter: 'all',
          resourceFilter: 'all',
          selectedResourceId: HEALTH_CENTERS[0].id,
          gpsLocation: null,

          gpsStatusText: 'Static Demo Map · Manila City',

          applications: sb ? [] : normalizeApps(lsRead(LS_KEYS.APPLICATIONS, [])),
          notifications: sb ? [] : (Array.isArray(lsRead(LS_KEYS.NOTIFS, [])) ? lsRead(LS_KEYS.NOTIFS, []) : []),
          notifOpen: false,
          appsTab: null,
          appsFocusPetId: null,
          authModal: null,
          adoptionModal: null,
          toast: null,
          toastTimer: null,
          chatDraft: '',
          rehomePhoto: null,
          strayPhoto: null,
          rehome: {
            name: '',
            species: 'Dog',
            breed: '',
            ageLabel: '',
            district: 'Sampaloc',
            barangay: '',

            healthStatus: 'Healthy',

          },
          stray: {

            conditionOther: '',
            phone: '+63 ',
          },
        };

        // =========================================================================
        // 5. HELPERS: ESCAPE, ICONS, COORDINATES & HAVERSINE
        // =========================================================================
        const esc = (s) =>
          String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          }[c]));

        function formatPhilippinePhone(value) {
          let digits = String(value || '').replace(/\D/g, '');
          if (digits.startsWith('63')) digits = digits.slice(2);
          else if (digits.startsWith('0')) digits = digits.slice(1);
          digits = digits.slice(0, 10);
          const groups = [digits.slice(0, 3), digits.slice(3, 6), digits.slice(6, 10)].filter(Boolean);
          return `+63${groups.length ? ` ${groups.join(' ')}` : ''}`;
        }

        function projectLatLng(lat, lng) {
          const x = ((lng - MAP_BOUNDS.west) / (MAP_BOUNDS.east - MAP_BOUNDS.west)) * MAP_BOUNDS.width;
          const y = ((MAP_BOUNDS.north - lat) / (MAP_BOUNDS.north - MAP_BOUNDS.south)) * MAP_BOUNDS.height;
          return {
            x: Math.max(32, Math.min(MAP_BOUNDS.width - 32, x)),
            y: Math.max(32, Math.min(MAP_BOUNDS.height - 32, y)),
          };
        }

        function haversineKm(lat1, lng1, lat2, lng2) {
          const R = 6371;
          const dLat = ((lat2 - lat1) * Math.PI) / 180;
          const dLng = ((lng2 - lng1) * Math.PI) / 180;
          const a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
          return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function ico(name, cls = 'w-4 h-4') {
          const base = `class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;

            case 'bag': return `<svg ${base}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`;
            case 'logOut': return `<svg ${base}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>`;
            case 'lock': return `<svg ${base}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
            case 'shield': return `<svg ${base}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>`;
            case 'clock': return `<svg ${base}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
            case 'alert': return `<svg ${base}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>`;
            case 'phone': return `<svg ${base}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
            case 'send': return `<svg ${base}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>`;
            case 'plus': return `<svg ${base}><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
            case 'minus': return `<svg ${base}><path d="M5 12h14"/></svg>`;
            case 'trash': return `<svg ${base}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;
            case 'check': return `<svg ${base}><polyline points="20 6 9 17 4 12"/></svg>`;
            case 'checkCircle': return `<svg ${base}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
            case 'x': return `<svg ${base}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`;
            case 'arrowRight': return `<svg ${base}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
            case 'arrowLeft': return `<svg ${base}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`;
            case 'nav': return `<svg ${base}><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`;
            case 'zoomIn': return `<svg ${base}><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>`;
            case 'zoomOut': return `<svg ${base}><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>`;
            case 'reset': return `<svg ${base}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`;
            case 'bell': return `<svg ${base}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;
            case 'users': return `<svg ${base}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;
            case 'paw': return `<svg ${base}><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>`;

        }

        function toast(msg) {
          S.toast = msg;
          if (S.toastTimer) clearTimeout(S.toastTimer);
          render();
          S.toastTimer = setTimeout(() => {
            S.toast = null;
            render();
          }, 3800);
        }

        // =========================================================================
        // 6. DERIVED DATA HELPERS
        // =========================================================================
        function getAllResources() {
          const clinics = HEALTH_CENTERS.map((hc) => ({ ...hc, kind: 'clinic', subtitle: hc.category }));
          const shops = FOOD_SHOPS.map((fs) => ({ ...fs, kind: 'food', subtitle: 'Pet Food & Supplies Store' }));
          return [...clinics, ...shops];
        }

        function getFilteredPets() {
          const active = S.pets.filter((p) => p.adoptionStage !== 'Pet Adopted');
          return active.filter((p) => {
            if (S.petFilter === 'Dog') return p.species === 'Dog';
            if (S.petFilter === 'Cat') return p.species === 'Cat';
            if (S.petFilter === 'stray') return p.listingType === 'stray' || p.status === 'URGENT RESCUE';
            return true;
          });
        }

        function getFilteredResources() {
          return getAllResources().filter((r) => {
            if (S.resourceFilter === 'clinic') return r.kind === 'clinic';
            if (S.resourceFilter === 'food') return r.kind === 'food';
            return true;
          });
        }

        // =========================================================================
        // 7. SUPABASE SYNC HELPERS (OPTIONAL WHEN config.js HAS CREDENTIALS)
        // =========================================================================
        function rowToPet(row) {
          return {
            id: String(row.id),
            name: String(row.name),
            species: row.species || 'Dog',
            breed: String(row.breed),
            ageLabel: String(row.age_label),
            status: row.status || 'HEALTHY',
            healthStatus: row.health_status || 'Healthy',
            healthConditions: row.health_conditions || [],
            temperamentPreferences: row.temperament_preferences || [],
            adoptionStage: row.adoption_stage || 'Available',
            listingType: row.listing_type || 'adoption',
            district: String(row.district),
            barangay: String(row.barangay),
            lat: Number(row.lat),
            lng: Number(row.lng),
            vaccinated: Boolean(row.vaccinated),
            medicalNotes: String(row.medical_notes || ''),
            rehomingReason: row.rehoming_reason ? String(row.rehoming_reason) : undefined,
            reporterName: String(row.reporter_name),
            reporterPhone: row.reporter_phone ? String(row.reporter_phone) : undefined,
            ownerId: row.owner_id ? String(row.owner_id) : null,
            imageUrl: safePetImage({ id: String(row.id), species: row.species, imageUrl: row.image_url }),
          };
        }

        const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

        function petPayload(p) {
          const payload = {
            name: p.name,
            species: p.species,
            breed: p.breed,
            age_label: p.ageLabel,
            status: p.status,
            health_status: p.healthStatus,
            health_conditions: p.healthConditions,
            temperament_preferences: p.temperamentPreferences || [],
            adoption_stage: p.adoptionStage,
            listing_type: p.listingType,
            district: p.district,
            barangay: p.barangay,
            lat: p.lat,
            lng: p.lng,
            vaccinated: p.vaccinated,
            medical_notes: p.medicalNotes,
            rehoming_reason: p.rehomingReason || null,
            reporter_name: p.reporterName,
            reporter_phone: p.reporterPhone || null,
            image_url: p.imageUrl || null,
          };
          if (S.user && UUID_RE.test(String(S.user.id))) payload.owner_id = S.user.id;
          return payload;
        }

        function upsertPetLocal(pet) {
          const exists = S.pets.some((p) => p.id === pet.id);
          S.pets = exists ? S.pets.map((p) => (p.id === pet.id ? { ...p, ...pet } : p)) : [pet, ...S.pets];
        }

        function removePetLocal(id) {
          S.pets = S.pets.filter((p) => p.id !== id);
          if (S.selectedPetId === id) S.selectedPetId = null;
        }

        // Live pets: saved to Supabase when configured, otherwise kept in localStorage (demo mode).
        async function createPet(localPet) {
          if (!sb) {
            S.pets = [localPet, ...S.pets];
            persistPets();
            return localPet;
          }
          const { data, error } = await sb.from('pets').insert(petPayload(localPet)).select().single();
          if (error || !data) {
            toast(`Could not save to Supabase: ${error ? error.message : 'unknown error'}`);
            return null;
          }
          const saved = rowToPet(data);
          upsertPetLocal(saved);
          return saved;
        }

        async function syncFromSupabase() {
          if (!sb) return;
          try {
            const { data, error } = await sb.from('pets').select('*').order('created_at', { ascending: false });
            if (!error && Array.isArray(data)) {
              S.pets = data.map(rowToPet);
              if (S.selectedPetId && !S.pets.some((p) => p.id === S.selectedPetId)) S.selectedPetId = null;
              render();
            }
          } catch (_) {}
        }

        let petsChannel = null;
        function subscribePetsRealtime() {
          if (!sb || petsChannel) return;
          petsChannel = sb
            .channel('pawpath-pets-live')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pets' }, (payload) => {
              const pet = rowToPet(payload.new);
              const known = S.pets.some((p) => p.id === pet.id);
              upsertPetLocal(pet);
              render();
              if (!known) toast(`New ${pet.listingType === 'stray' ? 'stray report' : 'pet'}: ${pet.name}`);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pets' }, (payload) => {
              upsertPetLocal(rowToPet(payload.new));
              render();
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'pets' }, (payload) => {
              if (payload.old && payload.old.id) removePetLocal(String(payload.old.id));
              render();
            })
            .subscribe((status) => {
              // Re-fetch on (re)connect so nothing is missed while the socket was down.
              if (status === 'SUBSCRIBED') syncFromSupabase();
            });
        }

        // =========================================================================
        // 8. GLOBAL INTERACTIVE ACTIONS (WINDOW.PP)
        // =========================================================================
        const PP = {
          navigate(view, mapPane) {
            if (!S.user && view !== 'home') {
              PP.openAuth('login');
              toast('Please log in to access PawPath Manila system tools.');
              return;
            }
            if (mapPane) S.mapPane = mapPane;
            S.view = view;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          },

          openAuth(mode) {
            S.authModal = {
              mode: mode || 'login',
              error: null,
              submitting: false,
              email: '',

          formatSignupMobile(input) {
            const value = input.value;
            const cursor = input.selectionStart === null ? value.length : input.selectionStart;
            const digitsBeforeCursor = value.slice(0, cursor).replace(/\D/g, '').replace(/^63/, '').length;
            let digits = value.replace(/\D/g, '');
            if (digits.startsWith('63')) digits = digits.slice(2);
            digits = digits.slice(0, 10);

            let formatted = `+63 ${digits.slice(0, 3)}`;
            if (digits.length >= 3) formatted += ' ';
            if (digits.length > 3) formatted += digits.slice(3, 6);
            if (digits.length >= 6) formatted += ' ';
            if (digits.length > 6) formatted += digits.slice(6, 10);

            let position = 4;
            const digitsToPosition = Math.min(digitsBeforeCursor, digits.length);
            for (let i = 0; i < digitsToPosition; i += 1) {
              if (i === 3 || i === 6) position += 1;
              position += 1;
            }

            input.value = formatted;
            input.setSelectionRange(position, position);
          },

              // Local demo mode: only accounts created on this device can log in.
              const acct = getAccounts().find((a) => a.email === email);
              if (!acct) throw new Error('No account with that email was found on this device. Please sign up first.');
              if (acct.passHash !== (await hashPw(email, password))) throw new Error('Incorrect password. Please try again.');
              PP.finishLogin(acct.profile, `Welcome back, ${acct.profile.fullName}!`);
            } catch (err) {
              if (S.authModal) {
                let msg = err && err.message ? err.message : 'Unable to sign in. Please check your details and try again.';
                if (/email not confirmed/i.test(msg)) msg = 'Please confirm your email first: open the confirmation link we sent you, then log in again.';

          async submitAuthSignup(e) {
            e.preventDefault();
            if (!S.authModal) return;
            const f = e.target;
            const fullName = (f.fullName.value || '').trim();
            const email = (f.email.value || '').trim().toLowerCase();
            const password = f.password.value || '';
            const ageNum = parseInt(f.age.value, 10);
            const mobile = (f.mobile.value || '').trim();
            const district = f.district.value || 'Sampaloc';
            const barangay = (f.barangay.value || '').trim();

            if (Number.isNaN(ageNum) || ageNum < 18) {
              S.authModal.error = 'You must be at least 18 years old under RA 10631 adoption guidelines.';
              render();
              return;
            }

            if (!/^\+63 \d{3} \d{3} \d{4}$/.test(mobile)) {
              S.authModal.error = 'Enter a valid mobile number in the format +63 917 123 4567.';
              render();
              return;
            }

            if (password.length < 6) {
              S.authModal.error = 'Password must be at least 6 characters.';
              render();
              return;
            }

            S.authModal.error = null;
            S.authModal.notice = null;
            S.authModal.submitting = true;
            render();

            try {
              const profile = { id: `usr-${Date.now()}`, fullName, email, mobile, age: ageNum, district, barangay: barangay || `${district}, Manila`, role: 'citizen' };

              if (sb) {
                const { data, error } = await sb.auth.signUp({
                  email,
                  password,
                  options: { data: { full_name: fullName, mobile, age: ageNum, district, barangay } },
                });
                if (error) throw error;
                if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                  throw new Error('An account with this email already exists. Please log in instead.');
                }
                if (!data || !data.session) {
                  // Email confirmation is enabled in Supabase: the account exists, but there is no session yet.
                  S.authModal.mode = 'login';
                  S.authModal.submitting = false;
                  S.authModal.notice = 'Account created! Check your email and click the confirmation link, then log in here.';
                  render();
                  return;
                }
                profile.id = data.user.id;
                try {
                  await sb.from('profiles').upsert({
                    id: profile.id,
                    full_name: fullName,
                    email,
                    mobile,
                    age: ageNum,
                    is_adult_confirmed: true,
                    district,
                    barangay: barangay || district,
                    role: 'citizen',
                  });
                } catch (_) {}
                PP.finishLogin(profile, `Account created for ${fullName}. Welcome to PawPath Manila.`);
                return;
              }

              // Local demo mode: save the account so it can be logged into again on this device.
              const accts = getAccounts();
              if (accts.some((a) => a.email === email)) throw new Error('An account with this email already exists on this device. Please log in instead.');
              accts.push({ email, passHash: await hashPw(email, password), profile });
              lsWrite(LS_KEYS.ACCOUNTS, accts);
              PP.finishLogin(profile, `Account created for ${fullName}. Welcome to PawPath Manila.`);
            } catch (err) {
              if (S.authModal) {
                S.authModal.error = err && err.message ? err.message : 'Registration failed.';
                S.authModal.submitting = false;
                render();
              }
            }
          },

          detectGps() {
            S.locating = true;
            render();
            const preset = MANILA_DISTRICTS[S.gpsDistrictPreset] || MANILA_CENTER;

            const applyLoc = (coords, text) => {
              S.gpsLocation = coords;
              PP.focusCoords(coords.lat, coords.lng, 1.35);
              S.gpsStatusText = text;
              S.locating = false;
              render();
            };

            if (!navigator.geolocation) {
              applyLoc(preset, `Demo Area Detect · ${S.gpsDistrictPreset} (${preset.lat.toFixed(4)}, ${preset.lng.toFixed(4)})`);
              return;
            }

            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const { latitude, longitude } = pos.coords;
                const insideManila =
                  latitude >= MAP_BOUNDS.south &&
                  latitude <= MAP_BOUNDS.north &&
                  longitude >= MAP_BOUNDS.west &&
                  longitude <= MAP_BOUNDS.east;
                const coords = insideManila ? { lat: latitude, lng: longitude } : preset;
                const label = insideManila
                  ? `Browser GPS (${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)})`
                  : `Demo Area Detect · ${S.gpsDistrictPreset} (${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)})`;
                applyLoc(coords, label);
              },
              () => {
                applyLoc(preset, `Demo Area Detect · ${S.gpsDistrictPreset} (${preset.lat.toFixed(4)}, ${preset.lng.toFixed(4)})`);
              },
              { enableHighAccuracy: false, timeout: 4000 }
            );
          },

          // Owner/rescuer actions on an applicant
          async updateRequestStage(requestId, newStage) {
            const req = S.applications.find((a) => a.id === requestId);
            if (!req || !S.user) return;
            const pet = S.pets.find((p) => p.id === req.petId);
            if (!pet || !isMyListing(pet)) return;
            if (newStage === 'Declined' && !window.confirm(`Decline ${req.applicantName}'s request to adopt ${pet.name}?`)) return;
            if (newStage === 'Pet Adopted' && !window.confirm(`Confirm that ${pet.name} was adopted by ${req.applicantName}? Other requests will be closed.`)) return;

            const status = REVIEW_STATUS[newStage];
            const stamp = nowIso();
            const applyReq = async (r, stage) => {
              const rStatus = REVIEW_STATUS[stage];
              if (sb) {
                const { data, error } = await sb
                  .from('adoption_requests')
                  .update({ stage, review_status: rStatus, updated_at: stamp })
                  .eq('id', r.id)
                  .select();
                if (error || !data || data.length === 0) return false;
              }
              upsertRequestLocal({ ...r, stage, coordinatorReviewStatus: rStatus, updatedAt: stamp });
              return true;
            };

            if (!(await applyReq(req, newStage))) {
              toast('Could not update this request (no permission?). Try logging in again.');
              return;
            }

            let petStage = pet.adoptionStage;
            const others = requestsForPet(pet.id).filter((a) => a.id !== req.id);
            if (newStage === 'Pet Adopted') {
              petStage = 'Pet Adopted';
              for (const o of others.filter((x) => x.stage !== 'Declined' && x.stage !== 'Pet Adopted')) {
                await applyReq(o, 'Declined');
                await pushNotif({
                  recipientId: o.applicantId,
                  type: 'status_update',
                  title: `${pet.name} found a home`,
                  body: `${pet.name} was adopted by another citizen. Thank you for applying. Browse other pets in need on the Adoption Map.`,
                  petId: pet.id,
                  requestId: o.id,
                });
              }
            } else if (newStage === 'Ongoing Adoption') {
              petStage = 'Ongoing Adoption';
            } else if (newStage === 'Declined') {
              const active = others.filter((x) => x.stage !== 'Declined');
              petStage = active.some((x) => x.stage === 'Ongoing Adoption') ? 'Ongoing Adoption' : active.length ? 'Want to Adopt' : 'Available';
            }
            if (petStage !== pet.adoptionStage) {
              S.pets = S.pets.map((p) =>
                p.id === pet.id ? { ...p, adoptionStage: petStage, status: petStage === 'Pet Adopted' ? 'PET ADOPTED' : p.status } : p
              );
              persistPets();
              if (sb) {
                const patch = { adoption_stage: petStage };
                if (petStage === 'Pet Adopted') patch.status = 'PET ADOPTED';
                try { await sb.from('pets').update(patch).eq('id', pet.id); } catch (_) {}
              }
            }
            persistApps();

            const messages = {
              'Ongoing Adoption': [`Your request for ${pet.name} was approved`, `${pet.reporterName} approved your request. Expect a call or message to arrange a safe meetup at a Barangay or Veterinary sub-office.`],
              'Pet Adopted': [`Adoption of ${pet.name} is complete`, `Congratulations! ${pet.name} is officially adopted under your RA 10631 agreement.`],
              'Declined': [`Update on your request for ${pet.name}`, `${pet.reporterName} was not able to proceed with your request this time. You can apply for other pets on the Adoption Map.`],
            };
            if (messages[newStage]) {
              await pushNotif({ recipientId: req.applicantId, type: 'status_update', title: messages[newStage][0], body: messages[newStage][1], petId: pet.id, requestId: req.id });
            }
            toast(`${req.applicantName}: ${status}.`);
          },

          sendChat(e) {
            e.preventDefault();

            if (!body) return;
            const pet = S.pets.find((p) => p.id === S.selectedPetId) || S.pets[0];
            if (!pet) return;

            const timeNow = () => new Date().toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
            const msg = {
              id: `m-${Date.now()}`,
              petId: pet.id,
              senderName: S.user.fullName,
              senderRole: 'adopter',
              body,
              createdAt: timeNow(),
            };
            S.messages = [...S.messages, msg];
            S.chatDraft = '';
            lsWrite(LS_KEYS.MESSAGES, S.messages);
            if (sb) {
              sb.from('messages').insert({ pet_id: pet.id, sender_name: msg.senderName, sender_role: 'adopter', body }).then(() => {});
            }
            render();
            const stream = document.getElementById('chat-stream');
            if (stream) stream.scrollTop = stream.scrollHeight;

            setTimeout(() => {
              const reply = {
                id: `m-rep-${Date.now()}`,
                petId: pet.id,
                senderName: pet.reporterName || 'Shelter Coordinator',
                senderRole: 'coordinator',
                body: `Received your message regarding ${pet.name}. Our coordinator will review your application and coordinate a safe meetup.`,
                createdAt: timeNow(),
              };
              S.messages = [...S.messages, reply];
              lsWrite(LS_KEYS.MESSAGES, S.messages);
              if (sb) {
                sb.from('messages').insert({ pet_id: pet.id, sender_name: reply.senderName, sender_role: 'coordinator', body: reply.body }).then(() => {});
              }
              render();
              const stream2 = document.getElementById('chat-stream');
              if (stream2) stream2.scrollTop = stream2.scrollHeight;
            }, 650);
          },
          markAdopted(petId) {
            const target = S.pets.find((p) => p.id === petId);
            if (!target || !isMyListing(target)) return;
            S.pets = S.pets.map((p) =>
              p.id === petId ? { ...p, adoptionStage: 'Pet Adopted', status: 'PET ADOPTED' } : p
            );
            persistPets();
            if (sb) {
              sb.from('pets').update({ adoption_stage: 'Pet Adopted', status: 'PET ADOPTED' }).eq('id', petId).select().then(({ data, error }) => {
                if (error || !data || data.length === 0) toast(`Could not update pet in Supabase${error ? ': ' + error.message : ' (no permission?)'}`);
              });
            }
            toast('Adoption finalized. Listing marked as Pet Adopted.');
          },

          // Rehome Registry Form
          syncRehomeField(k, v) {
            S.rehome[k] = v;
          },
          setRehomeStatus(status) {
            S.rehome.healthStatus = status;
            render();
          },
          toggleRehomeCond(cond) {
            const arr = S.rehome.healthConditions;
            S.rehome.healthConditions = arr.includes(cond) ? arr.filter((x) => x !== cond) : [...arr, cond];
            render();
          },
          syncRehomeOther(v) {
            S.rehome.otherHealthCondition = v;
          },
          toggleRehomeTemp(pref) {
            const arr = S.rehome.temperamentPreferences;
            S.rehome.temperamentPreferences = arr.includes(pref) ? arr.filter((x) => x !== pref) : [...arr, pref];
            render();
          },
          async pickPhoto(kind, input) {
            const file = input.files && input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { toast('Please choose an image file.'); return; }
            try {
              const url = await resizeImage(file, 900, 0.78);
              if (kind === 'rehome') S.rehomePhoto = url; else S.strayPhoto = url;
              render();
            } catch (_) {
              toast('Could not read that photo. Try a JPG or PNG.');
            }
          },
          clearPhoto(kind) {
            if (kind === 'rehome') S.rehomePhoto = null; else S.strayPhoto = null;
            render();
          },

          async submitRehome(e) {
            e.preventDefault();
            if (!S.user) return;
            const f = e.target;
            const r = S.rehome;
            if (!S.rehomePhoto) { toast('Please add a photo of the pet (Photo Check).'); return; }
            r.name = f.name.value.trim();
            r.species = f.species.value;
            r.ageLabel = f.ageLabel.value.trim();
            r.breed = f.breed.value.trim();
            r.district = f.district.value;
            r.barangay = f.barangay.value.trim();
            r.rehomingReason = f.rehomingReason.value.trim();
            r.otherHealthCondition = (f.otherHealthCondition?.value || '').trim();
            if (r.healthConditions.includes('Other') && !r.otherHealthCondition) {
              toast('Please enter the pet&apos;s other health condition.');
              return;
            }

            const healthConditions = r.healthConditions.map((cond) =>
              cond === 'Other' ? `Other: ${r.otherHealthCondition}` : cond
            );

            const baseCoords = MANILA_DISTRICTS[r.district] || { lat: 14.6042, lng: 120.9886 };
            let newPet = {
              id: `pet-${Date.now()}`,
              name: r.name,
              species: r.species,
              breed: r.breed || (r.species === 'Dog' ? 'Local Aspin' : 'Local Puspin'),
              ageLabel: r.ageLabel,
              status: r.healthStatus === 'Healthy' ? 'HEALTHY' : 'NEEDS CARE',
              healthStatus: r.healthStatus,
              healthConditions,
              temperamentPreferences: [...r.temperamentPreferences],
              adoptionStage: 'Available',
              listingType: 'rehome',
              district: r.district,
              barangay: r.barangay || `${r.district}, Metro Manila`,
              lat: baseCoords.lat + (Math.random() - 0.5) * 0.005,
              lng: baseCoords.lng + (Math.random() - 0.5) * 0.005,
              vaccinated: r.healthConditions.includes('Fully Vaccinated'),
              medicalNotes: r.rehomingReason,
              rehomingReason: r.rehomingReason,
              reporterName: S.user.fullName,
              reporterPhone: S.user.mobile,
              ownerId: S.user.id,
              imageUrl: S.rehomePhoto,
            };

            newPet.imageUrl = await uploadPetPhoto(S.rehomePhoto);
            const savedPet = await createPet(newPet);
            if (!savedPet) return;
            newPet = savedPet;

            S.rehomePhoto = null;
            S.rehome = {
              name: '',
              species: 'Dog',
              breed: '',
              ageLabel: '',
              district: S.user.district || 'Sampaloc',
              barangay: '',
              rehomingReason: '',
              healthStatus: 'Healthy',
              healthConditions: ['Fully Vaccinated'],
              otherHealthCondition: '',
              temperamentPreferences: ['Friendly to Children'],
            };
            S.selectedPetId = newPet.id;
            S.mapPane = 'adoption';
            S.view = 'map';
            toast(`${newPet.name} registered and published to the Manila Adoption Map.`);
          },

          // Stray Report Form
          syncStrayField(k, v) {
            S.stray[k] = v;
          },
          formatStrayPhone(input) {
            input.value = formatPhilippinePhone(input.value);
            S.stray.phone = input.value;
          },
          toggleStrayCondition(condition) {
            const conditions = S.stray.conditionTypes;
            S.stray.conditionTypes = conditions.includes(condition)
              ? conditions.filter((item) => item !== condition)
              : [...conditions, condition];
            if (condition === 'Other' && !S.stray.conditionTypes.includes('Other')) {
              S.stray.conditionOther = '';
            }
            render();
          },
          async submitStray(e) {
            e.preventDefault();
            if (!S.user) return;
            const f = e.target;
            if (!S.strayPhoto) { toast('Please add a photo of the animal (Photo Check).'); return; }
            const species = f.species.value;
            const district = f.district.value;
            const conditionTypes = S.stray.conditionTypes;
            const conditionOther = (f.conditionOther?.value || '').trim();
            if (conditionTypes.length === 0) {
              toast('Please select at least one physical condition.');
              return;
            }
            if (conditionTypes.includes('Other') && !conditionOther) {
              toast('Please describe the other physical condition.');
              return;
            }
            const conditionDesc = conditionTypes
              .map((condition) => condition === 'Other' ? `Other: ${conditionOther}` : condition)
              .join(' · ');
            const locationText = f.locationText.value.trim();
            const phone = f.phone.value.trim();
            const baseCoords = MANILA_DISTRICTS[district] || { lat: 14.6188, lng: 120.9675 };

            let newStray = {
              id: `stray-${Date.now()}`,
              name: `Stray ${species} (${district})`,
              species,
              breed: `Stray ${species} · Urgent Dispatch`,
              ageLabel: 'Unknown Age',
              status: 'URGENT RESCUE',
              healthStatus: 'Needs Care',
              healthConditions: ['Ongoing Treatment'],
              temperamentPreferences: [],
              adoptionStage: 'Available',
              listingType: 'stray',
              district,
              barangay: locationText,
              lat: baseCoords.lat + (Math.random() - 0.5) * 0.004,
              lng: baseCoords.lng + (Math.random() - 0.5) * 0.004,
              vaccinated: false,
              medicalNotes: conditionDesc,
              reporterName: S.user.fullName,
              reporterPhone: phone,
              ownerId: S.user.id,
              imageUrl: S.strayPhoto,
            };

            newStray.imageUrl = await uploadPetPhoto(S.strayPhoto);
            const savedStray = await createPet(newStray);
            if (!savedStray) return;
            newStray = savedStray;

            S.strayPhoto = null;
            S.stray = { species: 'Dog', district: 'Tondo', locationText: '', conditionTypes: [], conditionOther: '', phone: S.user.mobile || '' };
            S.selectedPetId = newStray.id;
            S.mapPane = 'adoption';
            S.view = 'map';
            toast('Stray report published. Citizens who want to adopt will show up under Adoptions and in your notifications.');
          },

          // Remove a pet listing (saved to Supabase and broadcast live to every viewer)
          async deletePet(petId) {
            const pet = S.pets.find((p) => p.id === petId);
            if (!pet || !S.user) return;
            if (!window.confirm(`Remove ${pet.name} from PawPath Manila? This cannot be undone.`)) return;
            if (sb) {
              const { data, error } = await sb.from('pets').delete().eq('id', petId).select();
              if (error || !data || data.length === 0) {
                toast(`Could not delete from Supabase${error ? ': ' + error.message : ' (no permission?)'}`);
                return;
              }
            }
            removePetLocal(petId);
            persistPets();
            toast(`${pet.name} was removed.`);
          },
        };

        function renderMessages() {
          const activePet = S.pets.find((p) => p.id === S.selectedPetId) || S.pets[0];
          if (!activePet) {
            return `<div class="max-w-[600px] mx-auto px-4 py-16 text-center space-y-2">

              <p class="text-sm text-[#5A635C]">Threads appear once pets are logged on the Adoption Map.</p>
            </div>`;
          }
          const petMessages = S.messages.filter((m) => m.petId === activePet.id);
          const activeApplication = myApplications().find((a) => a.petId === activePet.id && a.stage !== 'Declined');
          const myOwnPet = isMyListing(activePet);

          return `
            <div class="max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">

                    <h2 class="font-display text-sm font-bold text-[#1A1A1A]">Shelter &amp; Rescue Threads</h2>

                      <span>Map</span>
                    </button>
                  </div>
                  <div class="divide-y divide-black/[0.06] overflow-y-auto flex-1">
                    ${S.pets
                      .map((pet) => {
                        const isSel = pet.id === activePet.id;
                        const hasApp = myApplications().some((a) => a.petId === pet.id && a.stage !== 'Declined');
                        return `
                          <button type="button" onclick="PP.selectChatPet('${esc(pet.id)}')" class="w-full text-left px-4 py-3 flex items-center gap-3 transition-colors ${isSel ? 'bg-[#F0F5F1]' : 'hover:bg-[#F7F8F4]'}">
                            <img src="${safePetImage(pet)}" alt="${esc(pet.name)}" class="w-11 h-11 rounded-lg object-cover shrink-0" />
                            <div class="min-w-0 flex-1">
                              <div class="flex items-center justify-between gap-2">
                                <span class="text-sm font-bold text-[#1A1A1A] truncate">${esc(pet.name)}</span>
                                <span class="text-[11px] font-semibold text-[#2D5A3C] shrink-0">${hasApp ? 'In Review' : esc(pet.adoptionStage)}</span>
                              </div>
                              <p class="text-xs text-[#5A635C] truncate">${esc(pet.reporterName)}</p>
                            </div>
                          </button>
                        `;
                      })
                      .join('')}
                  </div>
                </aside>

                <section class="lg:col-span-8 bg-white rounded-2xl border border-black/[0.08] overflow-hidden flex flex-col h-[620px]">
                  <div class="p-4 sm:p-5 border-b border-black/[0.08] space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                      <div class="flex items-center gap-3">
                        <img src="${safePetImage(activePet)}" alt="${esc(activePet.name)}" class="w-11 h-11 rounded-full object-cover" />
                        <div>
                          <h1 class="font-display text-base font-bold text-[#1A1A1A]">${esc(activePet.name)} · ${esc(activePet.breed)}</h1>
                          <p class="text-xs text-[#5A635C]">Coordinator: ${esc(activePet.reporterName)} · ${esc(activePet.district)}</p>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        ${
                          myOwnPet
                            ? `<button type="button" onclick="PP.openApplicants('${esc(activePet.id)}')" class="px-3.5 py-2 rounded-lg bg-[#2D5A3C] hover:bg-[#21432C] text-white text-xs font-semibold flex items-center gap-1.5 whitespace-nowrap">
                                ${ico('users', 'w-3.5 h-3.5')}
                                <span>See Citizens Who Want to Adopt</span>
                              </button>`
                            : ''
                        }
                        ${
                          !myOwnPet && !activeApplication && activePet.adoptionStage !== 'Pet Adopted'
                            ? `<button type="button" onclick="PP.openAdoptionModal('${esc(activePet.id)}')" class="px-3.5 py-2 rounded-lg bg-[#2D5A3C] hover:bg-[#21432C] text-white text-xs font-semibold flex items-center gap-1.5 whitespace-nowrap">
                                ${ico('shield', 'w-3.5 h-3.5')}
                                <span>Want to Adopt (Background Check)</span>
                              </button>`
                            : ''
                        }
                        ${
                          activeApplication && activePet.adoptionStage !== 'Pet Adopted'
                            ? `<button type="button" onclick="PP.setAppsTab('mine');PP.navigate('applications')" class="px-3.5 py-2 rounded-lg border border-[#2D5A3C] text-[#2D5A3C] hover:bg-[#F0F5F1] text-xs font-semibold whitespace-nowrap">Track My Application</button>`
                            : ''
                        }
                      </div>
                    </div>

                    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-1">
                      ${LIFECYCLE_STEPS.map((st) => {
                        const isCur = activePet.adoptionStage === st;
                        const cls = isCur
                          ? st === 'Pending Coordinator Review' || st === 'Ongoing Adoption'
                            ? 'bg-[#FEF3C7] text-[#92400E]'
                            : 'bg-[#2D5A3C] text-white'
                          : 'bg-[#F7F8F4] text-[#5A635C]';
                        return `<span class="px-2.5 py-1 rounded-md text-[11px] font-semibold whitespace-nowrap shrink-0 ${cls}">${st}</span>`;
                      }).join('')}
                    </div>

                    ${
                      activeApplication
                        ? `<div class="px-3 py-2 rounded-lg bg-[#FEF3C7] text-[#92400E] text-xs flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 font-semibold">
                              <span class="shrink-0">${ico('clock', 'w-4 h-4')}</span>
                              <span>${esc(activeApplication.coordinatorReviewStatus)}</span>
                            </div>
                            <span class="font-mono-num text-[11px]">RA 10631 Signed (${esc(activeApplication.submittedAt)})</span>

                    ${
                      petMessages.length === 0
                        ? `<div class="py-10 text-center text-xs text-[#5A635C]">No messages yet for ${esc(activePet.name)}. Send a greeting or submit your Background Check above.</div>`
                        : petMessages
                            .map((m) => {
                              const bubbleCls =
                                m.senderRole === 'adopter'
                                  ? 'bg-[#2D5A3C] text-white rounded-tr-sm'
                                  : m.senderRole === 'system'
                                    ? 'bg-[#EFF6FF] text-[#1E3A8A] border border-[#BFDBFE]'
                                    : 'bg-white text-[#1A1A1A] border border-black/[0.06] rounded-tl-sm';

                                  <span class="text-[11px] text-[#5A635C] mb-1 px-1">${esc(m.senderName)} · ${esc(m.createdAt)}</span>

                      ${ico('send', 'w-4 h-4')}
                      <span>Send</span>
                    </button>
                  </form>
                </section>
              </div>
            </div>
          `;

        window._ppDraft = (v) => { S.chatDraft = v; };

        function renderResourceCard(r, accent, label) {

            <article class="bg-white rounded-2xl border border-black/[0.08] p-5 sm:p-6 space-y-3">
              <div>
                <span class="text-xs font-semibold ${accent}">${esc(label)}</span>

                <button type="button" onclick="PP.navigate('map','resources')" class="px-4 h-10 rounded-lg border border-[#0284C7] text-[#0284C7] hover:bg-[#EFF6FF] text-xs font-semibold flex items-center gap-2 whitespace-nowrap">

        function renderFoodSupplies() {

        // ---- Photo check: resize in the browser, then upload to the pet-photos bucket ----
        function resizeImage(file, maxSide, quality) {
          return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
              const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              URL.revokeObjectURL(url);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
            img.src = url;
          });
        }

        // Returns a public URL when Supabase Storage works, otherwise keeps the compressed image inline.
        async function uploadPetPhoto(dataUrl) {
          if (!sb || !dataUrl || !dataUrl.startsWith('data:image/')) return dataUrl;
          try {
            const blob = await (await fetch(dataUrl)).blob();
            const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
            const { error } = await sb.storage.from('pet-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
            if (error) return dataUrl;
            const { data } = sb.storage.from('pet-photos').getPublicUrl(path);
            return (data && data.publicUrl) || dataUrl;
          } catch (_) {
            return dataUrl;
          }
        }

        // =========================================================================
        // 10. DRAG-TO-PAN WIRING FOR STATIC MANILA MAP & ROOT RENDER LOOP
        // =========================================================================
        let dragState = { active: false, startX: 0, startY: 0, origX: 0, origY: 0 };

        function attachMapDrag() {
          const vp = document.getElementById('manila-map-viewport');
          const stage = document.getElementById('manila-map-stage');
          if (!vp || !stage) return;

          vp.onpointerdown = (e) => {
            if (e.target && e.target.closest && e.target.closest('button')) return;
            dragState = { active: true, startX: e.clientX, startY: e.clientY, origX: S.mapPan.x, origY: S.mapPan.y };
          };
          vp.onpointermove = (e) => {
            if (!dragState.active) return;
            S.mapPan = {
              x: Math.max(-220, Math.min(220, dragState.origX + (e.clientX - dragState.startX))),
              y: Math.max(-180, Math.min(180, dragState.origY + (e.clientY - dragState.startY))),
            };
            stage.style.transform = `translate(${S.mapPan.x}px, ${S.mapPan.y}px) scale(${S.mapZoom})`;
          };
          vp.onpointerup = () => { dragState.active = false; };
          vp.onpointerleave = () => { dragState.active = false; };
        }


        // =========================================================================

        function renderStageStepper(stage) {
          if (stage === 'Declined') {
            return `<span class="inline-block px-2.5 py-1 rounded-md text-[11px] font-semibold bg-[#FCE8E6] text-[#A50E0E]">Not selected</span>`;
          }
          const steps = ['Pending Coordinator Review', 'Ongoing Adoption', 'Pet Adopted'];
          const labels = ['Submitted · owner review', 'Approved · meetup', 'Adopted'];
          const idx = steps.indexOf(stage);
          return `<div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">${steps
            .map((st, i) => {
              const cls = i < idx
                ? 'bg-[#E6F4EA] text-[#144226]'
                : i === idx
                  ? stage === 'Pet Adopted' ? 'bg-[#2D5A3C] text-white' : 'bg-[#FEF3C7] text-[#92400E]'
                  : 'bg-[#F7F8F4] text-[#5A635C]';
              return `<span class="px-2.5 py-1 rounded-md text-[11px] font-semibold whitespace-nowrap shrink-0 ${cls}">${i < idx ? '✓ ' : ''}${labels[i]}</span>`;

          const mineHtml =

              : mine
                  .map((a) => {
                    const pet = S.pets.find((p) => p.id === a.petId);
                    const hint =
                      a.stage === 'Pending Coordinator Review'
                        ? `${esc(a.ownerName || 'The owner')} has been notified and is reviewing your background check.`
                        : a.stage === 'Ongoing Adoption'
                          ? `Approved! ${esc(a.ownerName || 'The owner')} will arrange a safe meetup.${pet && pet.reporterPhone ? ` Contact: ${esc(pet.reporterPhone)}` : ''}`
                          : a.stage === 'Pet Adopted'
                            ? 'Adoption complete. Thank you for giving a home.'
                            : 'This request was not selected. You can apply for other pets.';
                    return `<div class="bg-white rounded-2xl border border-black/[0.08] p-4 sm:p-5 space-y-3">
                      <div class="flex items-center gap-3">
                        ${pet ? `<img src="${safePetImage(pet)}" alt="${esc(pet.name)}" class="w-14 h-14 rounded-xl object-cover" />` : ''}
                        <div class="min-w-0 flex-1">
                          <h2 class="font-display text-base font-bold text-[#1A1A1A] truncate">${esc(a.petName)}</h2>
                          <p class="text-xs text-[#5A635C]">Listed by ${esc(a.ownerName || 'owner')} · Applied ${esc(a.submittedAt)}</p>
                        </div>
                        ${pet ? `<button type="button" onclick="PP.openChat('${esc(a.petId)}')" class="px-3 h-9 rounded-lg border border-black/[0.12] text-xs font-semibold text-[#144226] hover:bg-[#F7F8F4] whitespace-nowrap">Message</button>` : ''}
                      </div>
                      ${renderStageStepper(a.stage)}
                      <p class="text-xs text-[#414942]">${hint}</p>
                    </div>`;
                  })
                  .join('');

          return `
            <div class="max-w-[860px] mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5">
              <div>
                <h1 class="font-display text-2xl font-bold text-[#1A1A1A]">Adoptions</h1>
                <p class="text-xs text-[#5A635C] mt-1">See who wants to adopt your listings, and follow the progress of your own applications.</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${tabBtn('adopters', 'Citizens who want to adopt my pets', pending)}
                ${tabBtn('mine', 'My applications', mine.filter((a) => a.stage === 'Ongoing Adoption').length)}
              </div>
              <div class="space-y-4">${tab === 'adopters' ? adoptersHtml : mineHtml}</div>
            </div>`;
        }

        function renderNotifPanel() {
          if (!S.user || !S.notifOpen) return '';
          const list = myNotifs().slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 30);
          const unread = list.filter((n) => !n.read).length;
          return `
            <div class="fixed inset-0 z-40" onclick="PP.toggleNotifs()" aria-hidden="true"></div>
            <section role="dialog" aria-label="Notifications" class="fixed z-50 top-[68px] right-3 sm:right-6 w-[calc(100vw-1.5rem)] sm:w-[380px] max-h-[70vh] flex flex-col bg-white rounded-2xl border border-black/[0.1] shadow-xl overflow-hidden">
              <div class="px-4 py-3 border-b border-black/[0.08] flex items-center justify-between">
                <h2 class="font-display text-sm font-bold text-[#1A1A1A]">Notifications${unread ? ` · ${unread} new` : ''}</h2>
                ${unread ? `<button type="button" onclick="PP.markAllNotifsRead()" class="text-xs font-semibold text-[#2D5A3C] hover:underline">Mark all read</button>` : ''}
              </div>
              <div class="overflow-y-auto divide-y divide-black/[0.06]">
                ${
                  list.length === 0
                    ? `<div class="px-4 py-10 text-center text-xs text-[#5A635C]">No updates yet. When someone wants to adopt your pet, or your application moves forward, it shows up here.</div>`
                    : list
                        .map(
                          (n) => `<button type="button" onclick="PP.openNotif('${esc(n.id)}')" class="w-full text-left px-4 py-3 flex gap-3 hover:bg-[#F7F8F4] ${n.read ? '' : 'bg-[#F0F5F1]'}">
                            <span class="mt-0.5 w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${n.type === 'new_applicant' ? 'bg-[#FDECDD] text-[#D97736]' : 'bg-[#E6F4EA] text-[#2D5A3C]'}">${ico(n.type === 'new_applicant' ? 'users' : 'checkCircle', 'w-4 h-4')}</span>
                            <span class="min-w-0 flex-1">
                              <span class="block text-xs font-bold text-[#1A1A1A]">${esc(n.title)}</span>
                              ${n.body ? `<span class="block text-[11px] text-[#5A635C] mt-0.5 leading-snug">${esc(n.body)}</span>` : ''}
                              <span class="block text-[10px] text-[#8A928C] mt-1">${esc(timeAgo(n.createdAt))}</span>
                            </span>
                            ${n.read ? '' : '<span class="mt-1.5 w-2 h-2 rounded-full bg-[#D97736] shrink-0"></span>'}
                          </button>`
                        )
                        .join('')
                }
              </div>
            </section>`;
        }

        function renderMain() {
          if (!S.user) return renderPreLoginLanding();
          switch (S.view) {
            case 'map': return renderDualMaps();
            case 'chat': return renderMessages();
            case 'applications': return renderApplications();
            case 'health': return renderHealthCenters();
            case 'food': return renderFoodSupplies();
            case 'rehome': return renderRehomeForm();
            case 'stray': return renderStrayForm();
            default: return renderUserHub();
          }
        }

        function render() {
          const root = document.getElementById('app');
          if (!root) return;
          const toastHtml = S.toast
            ? `<div role="status" aria-live="polite" class="fixed bottom-20 lg:bottom-6 right-4 sm:right-6 z-50 bg-[#144226] text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5 text-xs sm:text-sm font-medium max-w-sm">
                <span class="text-[#A7D7B8] shrink-0">${ico('checkCircle', 'w-4 h-4')}</span>
                <span>${esc(S.toast)}</span>
              </div>`
            : '';

          root.innerHTML = `
            ${renderHeader()}
            ${renderNotifPanel()}
            <main class="flex-1 ${S.user ? 'pb-20 lg:pb-12' : 'pb-12'}">
              ${renderMain()}
            </main>
            ${renderAuthModal()}
            ${renderAdoptionModal()}
            ${toastHtml}
          `;

          if (S.user && S.view === 'map') {
            attachMapDrag();
          }
          if (S.user && S.view === 'chat') {
            const stream = document.getElementById('chat-stream');
            if (stream) stream.scrollTop = stream.scrollHeight;
          }
        }

        render();
        syncFromSupabase();
        subscribePetsRealtime();
        restoreSession();

        // Demo mode: keep two tabs of the same browser in sync (pets, applications, notifications).
        window.addEventListener('storage', (ev) => {
          if (sb) return;
          if (ev.key === LS_KEYS.APPLICATIONS) S.applications = normalizeApps(lsRead(LS_KEYS.APPLICATIONS, []));
          else if (ev.key === LS_KEYS.NOTIFS) S.notifications = lsRead(LS_KEYS.NOTIFS, []) || [];
          else if (ev.key === LS_KEYS.PETS) {
            const stored = lsRead(LS_KEYS.PETS, []);
            if (Array.isArray(stored)) S.pets = stored.filter((p) => !SEED_PET_IDS.test(String(p.id))).map((p) => ({ ...p, imageUrl: safePetImage(p) }));
          } else return;
          render();
        });
      })();
    </script>
  </body>
</html>
